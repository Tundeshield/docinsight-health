name: Operations
# Runs a DocInsight operations command against production (seed demo, AI evaluation, grant admin, config).
on:
  workflow_dispatch:
    inputs:
      command: { description: "config | seed-demo | eval | grant-admin", required: true, default: "config" }
      args: { description: "Arguments, e.g. an email or 'demo'", required: false, default: "" }
permissions: { contents: read, id-token: write }
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: npm ci --prefix functions && npm --prefix functions run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/624234745329/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@docinsight-health.iam.gserviceaccount.com
      - name: Read secrets the command needs
        run: |
          KEY=$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project docinsight-health 2>/dev/null || true)
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Run
        env: { GCLOUD_PROJECT: docinsight-health, GOOGLE_CLOUD_PROJECT: docinsight-health }
        run: node functions/lib/ops.js ${{ inputs.command }} ${{ inputs.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ops-output, path: "eval-report.json", if-no-files-found: ignore }
