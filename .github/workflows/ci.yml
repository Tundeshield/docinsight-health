name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Shared unit tests
        run: npx vitest run shared
      - name: Security rules tests (emulators)
        run: npx firebase emulators:exec --only firestore,storage --project demo-docinsight "npx vitest run tests/rules"
      - name: Functions typecheck and build
        run: npm ci --prefix functions && npm --prefix functions run typecheck && npm --prefix functions run build && node -e "const m=require('./functions/lib/index.js');console.log(Object.keys(m).length+' exports')"
      - name: Web app typecheck and build
        run: npm ci --prefix web && npm --prefix web run build
