name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Shared unit tests
        run: npx vitest run shared
      - name: Security rules tests (emulators)
        run: npx firebase emulators:exec --only firestore,storage --project demo-docinsight "npx vitest run tests/rules"
